# LiveKit configuration for LOCAL DEVELOPMENT ONLY. The key pair below is a throwaway dev
# credential; production must use generated keys supplied via environment/secrets.
port: 7880
rtc:
  tcp_port: 7881
  # A single multiplexed UDP port keeps Docker port mapping simple on macOS/Windows.
  udp_port: 7882
  use_external_ip: false
  # Advertise loopback (browsers and CLIs reach the published port on localhost) and the Docker
  # bridge (the recorder runs in this container's network namespace and cannot ICE to loopback).
  ips:
    includes:
      - 127.0.0.0/8
      - 172.16.0.0/12
redis:
  address: redis:6379
keys:
  devkey: devsecret-devsecret-devsecret-devsecret
room:
  # Rooms are created explicitly by the API; never allow participants to create them.
  auto_create: false
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:8080/v1/webhooks/livekit
logging:
  level: info
